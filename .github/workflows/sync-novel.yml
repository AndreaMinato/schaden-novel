# Reusable: import new chapters for one novel from its Google Doc menu, validate, push to main.
name: sync-novel

on:
  workflow_call:
    inputs:
      slug:
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.156.0'
          extended: true

      - name: Import new chapters
        run: node scripts/sync_menu.mjs "${{ inputs.slug }}"

      - name: Detect changes
        id: changes
        run: |
          git add content/ scripts/menu_state/
          if git diff --cached --quiet; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            git diff --cached --name-only --diff-filter=A -- content/ | sed 's#^#- #' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate
        if: steps.changes.outputs.any == 'true'
        run: |
          if grep -rlE '^title:\s*\[' content/novels; then
            echo "::error::broken YAML title detected"; exit 1
          fi
          hugo --quiet --renderToMemory

      - name: Commit and push
        if: steps.changes.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update novels (${{ inputs.slug }})"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Gap report
        if: steps.changes.outputs.any == 'true'
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/check-gaps.mjs >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
