name: sync-tmw

on:
  workflow_dispatch:
    inputs:
      notify_test:
        description: Send a Telegram test message
        type: boolean
        default: false
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

concurrency:
  group: novel-sync
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-novel.yml
    with:
      notify_test: ${{ inputs.notify_test || false }}
      slug: tmw
